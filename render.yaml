databases:
  - name: cswdo-db
    plan: free
    region: singapore
    databaseName: cswdo
    user: cswdo

services:
  - type: web
    name: cswdo-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn cswdo_system.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cswdo-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: MEDIA_ROOT
        value: /opt/render/project/src/media
      - key: PRIVATE_MEDIA_ROOT
        value: /opt/render/project/src/private_media
